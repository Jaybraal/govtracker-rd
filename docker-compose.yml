version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: govtracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: govtracker
      POSTGRES_PASSWORD: govtracker2024
      POSTGRES_DB: govtracker_rd
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govtracker -d govtracker_rd"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: govtracker_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: govtracker_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://govtracker:govtracker2024@db:5432/govtracker_rd
      DATABASE_URL_ASYNC: postgresql+asyncpg://govtracker:govtracker2024@db:5432/govtracker_rd
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - govdata:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: govtracker_worker
    restart: unless-stopped
    command: celery -A app.etl.pipeline.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql://govtracker:govtracker2024@db:5432/govtracker_rd
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
      - govdata:/app/data
    depends_on:
      - db
      - redis
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: govtracker_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  govdata:
